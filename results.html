<body class="results-board">
  <main class="election-night-page" aria-label="2026 election results">
    <h1 class="board-sr-only">2026 Election Night</h1>
    <div class="board-top-controls">
      <div class="election-mode-toggle" role="tablist" aria-label="Election office">
        <button type="button" data-mode="house" role="tab">House</button><button type="button" data-mode="senate" role="tab">Senate</button><button type="button" data-mode="governor" role="tab">Governors</button>
      </div>
      <section class="election-chamber-board" aria-label="Chamber control">
        <p id="chamber-board-subtitle" class="board-sr-only"></p>
        <div class="election-chamber-meter"><div class="election-chamber-labels"><strong id="chamber-dem-count">0 D</strong><span id="chamber-majority-label">218 for majority</span><strong id="chamber-rep-count">0 R</strong></div>
          <div class="election-chamber-bar"><span id="chamber-bar-dem-safe" class="election-chamber-segment chamber-dem-safe" hidden></span><span id="chamber-bar-dem" class="election-chamber-segment chamber-dem"></span><span id="chamber-bar-uncalled" class="election-chamber-segment chamber-uncalled"></span><span id="chamber-bar-rep" class="election-chamber-segment chamber-rep"></span><span id="chamber-bar-rep-safe" class="election-chamber-segment chamber-rep-safe" hidden></span><i id="chamber-majority-line" class="election-chamber-majority-line" aria-hidden="true"></i></div>
        </div>
      </section>
    </div>
    <div class="board-overflow"><button id="board-menu-button" type="button" aria-label="Results menu" aria-expanded="false" aria-controls="board-menu">⋯</button><div id="board-menu" hidden><a href="/">Return to main site</a><button type="button" data-desk-appearance>Appearance</button><label class="desk-outline-setting">Yellow outlines<select id="desk-outline-mode" aria-label="Yellow outlines"><option value="next">Next poll closes</option><option value="watch">Races to watch</option></select></label></div></div>
    <p id="results-provider-status" class="board-delay" role="status" hidden></p>
    <section class="election-map-panel" aria-label="Election results map"><div class="election-map-shell"><div id="election-map" class="election-map-canvas"></div>
      <aside id="focused-race-panel" class="election-focus-panel election-focus-overlay" aria-labelledby="focused-race-title" hidden>
        <div class="focused-card-head"><span id="focused-race-kind" class="focused-pill" hidden></span><span id="focused-race-rating" class="focused-pill focused-pill-light"></span><button class="sheet-toggle" type="button" aria-label="Expand race details" aria-expanded="false">⌃</button><button class="focused-close" type="button" data-clear-focus aria-label="Close selected race">×</button></div>
        <h2 id="focused-race-title">Select a race</h2><div id="focused-race-content"></div><button type="button" class="focus-resize-handle" aria-label="Resize race window. Arrow keys resize; Home or double-click resets." title="Drag to resize · double-click to reset">◢</button>
      </aside>
    </div></section>
    <section id="projection-alerts" aria-label="Recent projections"></section><p id="projection-announcer" class="board-sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
