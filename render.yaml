services:
  - type: web
    name: federal-elections-analysis
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: CONTACT_TO
        value: federalelectionsanalysis@gmail.com
      - key: CONTACT_FROM
        value: federalelectionsanalysis@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
