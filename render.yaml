services:
  - type: web
    name: federal-elections-analysis
    env: node
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run audit:results-candidates
    startCommand: npm start
    disk:
      name: election-results
      mountPath: /var/data/election-results
      sizeGB: 10
    envVars:
      - key: RESULTS_STORAGE_DIR
        value: /var/data/election-results
      - key: RESULTS_REQUIRE_PERSISTENCE
        value: "1"
      - key: RESULTS_EXPECTED_STORAGE_ROOT
        value: /var/data/election-results
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: CONTACT_TO
        value: federalelectionsanalysis@gmail.com
      - key: CONTACT_FROM
        value: federalelectionsanalysis@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
