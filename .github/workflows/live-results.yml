name: Live results refresh

on:
  schedule:
    # Election-night refresh window in UTC. Static hosting needs committed JSON
    # updates because browser clients cannot rely on the local Node API route.
    - cron: "*/5 * 2-4 6 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-results-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate live results data
        run: node scripts/generate-live-results.mjs

      - name: Commit live results data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-results.json data/live-results-races/*.json
          if git diff --cached --quiet; then
            echo "No live results changes to commit."
            exit 0
          fi
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add data/live-results.json data/live-results-races/*.json
          git commit -m "Update live results"
          git push origin "HEAD:$GITHUB_REF_NAME" || {
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          }
