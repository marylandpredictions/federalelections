name: Daily Trump approval

on:
  schedule:
    # Early morning Central — rebuild the public average once per day.
    - cron: "40 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-trump-approval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync branch before generation
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Build Trump approval average
        run: npm run build:trump-approval

      - name: Commit approval data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polling/trump-approval.json
          if git diff --cached --quiet; then
            echo "No Trump approval changes to commit."
            exit 0
          fi
          git commit -m "Update Trump approval average"
          git push origin "HEAD:$GITHUB_REF_NAME"
