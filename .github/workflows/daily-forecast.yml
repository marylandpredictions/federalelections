name: Daily forecast

on:
  schedule:
    # Primary target: 6:20 AM Central during daylight time.
    # GitHub scheduled workflows can be delayed, so the later entries are
    # backup triggers. The model scripts are date-idempotent and the commit
    # step only writes when data changes.
    - cron: "20 11 * * *"
    - cron: "45 11 * * *"
    - cron: "10 12 * * *"
    - cron: "35 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-forecast]

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate forecast data
        run: |
          node scripts/generate-forecast.mjs
          node scripts/generate-house-forecast.mjs
          node scripts/generate-videos.mjs
          for dem in newsom beshear shapiro buttigieg harris aoc; do
            for rep in vance rubio desantis haley cruz; do
              node scripts/generate-president-forecast.mjs "$dem" "$rep"
            done
          done

      - name: Commit forecast data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily forecasts"
          file_pattern: data/*.json
