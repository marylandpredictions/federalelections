name: Daily forecast

on:
  schedule:
    # Primary target: early morning Central (roughly 5:00-6:30 AM CT / 6:00-7:30 AM ET).
    # GitHub scheduled workflows can be delayed or dropped, so these staggered
    # entries provide backup chances through late morning. The model scripts
    # are date-idempotent and the commit step only writes when data changes.
    - cron: "0 10 * * *"
    - cron: "20 10 * * *"
    - cron: "40 10 * * *"
    - cron: "0 11 * * *"
    - cron: "20 11 * * *"
    - cron: "45 11 * * *"
    - cron: "10 12 * * *"
    - cron: "35 12 * * *"
    - cron: "0 13 * * *"
    - cron: "30 13 * * *"
    - cron: "0 14 * * *"
    - cron: "30 14 * * *"
    - cron: "0 15 * * *"
    - cron: "30 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-forecast]

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate forecast data
        run: |
          node scripts/generate-forecast.mjs
          node scripts/generate-house-forecast.mjs
          node scripts/generate-governor-forecast.mjs
          node scripts/generate-videos.mjs
          node scripts/generate-live-results.mjs
          for dem in newsom beshear shapiro buttigieg harris aoc; do
            for rep in vance rubio desantis haley cruz; do
              node scripts/generate-president-forecast.mjs "$dem" "$rep"
            done
          done
          node scripts/update-president-aggregate.mjs

      - name: Verify generated JSON
        run: node scripts/verify-data-json.mjs

      - name: Verify forecast freshness
        run: node scripts/verify-forecast-freshness.mjs

      - name: Commit forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add data/*.json data/live-results-races/*.json
          if git diff --cached --quiet; then
            echo "No forecast data changes to commit."
            exit 0
          fi
          git commit -m "Update daily forecasts"
          git push origin "HEAD:$GITHUB_REF_NAME" || {
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          }
