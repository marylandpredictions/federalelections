name: Daily forecast

on:
  schedule:
    # Primary target: early morning Central. Keep this to one scheduled run so
    # generated JSON files are not repeatedly committed and rebased over each
    # other by overlapping backup runs.
    - cron: "20 10 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-forecast]

permissions:
  contents: write

concurrency:
  group: daily-forecast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync branch before generation
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Generate forecast data
        run: |
          node scripts/generate-forecast.mjs
          node scripts/generate-house-forecast.mjs
          node scripts/generate-governor-forecast.mjs
          node scripts/generate-videos.mjs
          node scripts/generate-live-results.mjs
          for dem in newsom beshear shapiro buttigieg harris aoc; do
            for rep in vance rubio desantis haley cruz; do
              node scripts/generate-president-forecast.mjs "$dem" "$rep"
            done
          done
          node scripts/update-president-aggregate.mjs

      - name: Verify generated JSON
        run: node scripts/verify-data-json.mjs

      - name: Verify forecast freshness
        run: node scripts/verify-forecast-freshness.mjs

      - name: Verify forecast history was preserved
        run: node scripts/verify-forecast-history.mjs

      - name: Commit forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/live-results-races/*.json
          if git diff --cached --quiet; then
            echo "No forecast data changes to commit."
            exit 0
          fi
          git commit -m "Update daily forecasts"
          git push origin "HEAD:$GITHUB_REF_NAME"
