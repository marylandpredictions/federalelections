name: Detect NBC 2026 general-election results
on:
  schedule:
    - cron: '*/5 * 29-31 10 *'
    - cron: '*/5 * 1-7 11 *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nbc-2026-results-activation
  cancel-in-progress: false
jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/results/
            /scripts/detect-nbc-2026-results.mjs
            /data/results-provider.json
            /data/election-night-races.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect public NBC infrastructure
        id: discovery
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--write)
          if [ "$MANUAL" = true ]; then args+=(--manual); fi
          node scripts/detect-nbc-2026-results.mjs "${args[@]}"
      # GITHUB_TOKEN commits do not trigger another push workflow. Run all gates
      # here instead of assuming results-quality will run on the bot's commit.
      - name: Install and verify activation
        if: steps.discovery.outputs.changed == 'true'
        run: |
          git sparse-checkout disable
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow origin main
          fi
          npm ci
          npm run audit:results-candidates
          npm run test:results
      - name: Commit and push verified configuration only
        if: steps.discovery.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/results-provider.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = 'data/results-provider.json'
          git commit -m 'Auto-enable NBC 2026 general election results'
          for attempt in 1 2 3; do
            # npm ci changes tracked platform metadata in this repository.
            # Preserve that install while rebasing; never stage it for publishing.
            git -c rebase.autoStash=true pull --rebase origin main
            npm run audit:results-candidates
            npm run test:results
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Push failed safely; no force push. Next scheduled run retries discovery.'
          exit 1
